<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المرشحون المختارون | فعلي</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#102c50;font-family:Tahoma,Arial,sans-serif}header{background:#0b2b56;color:white;padding:22px max(20px,calc((100vw - 1000px)/2))}header a{color:white;margin-left:20px;text-decoration:none}main{max-width:1000px;margin:35px auto;padding:0 18px}h1{font-size:27px}p{line-height:1.8;color:#526985}.list{display:grid;gap:14px}.card{background:white;border:1px solid #dce7f6;border-radius:14px;padding:20px;display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.card b{font-size:17px}.card small{display:block;margin-top:9px;color:#526985}.btn{display:inline-block;background:#175cd3;color:#fff;padding:12px 17px;border-radius:9px;text-decoration:none;font-weight:700;border:0;cursor:pointer}.btn:hover{background:#1048aa}.empty{padding:40px;text-align:center;background:white;border-radius:14px;border:1px solid #dce7f6}@media(max-width:600px){header{padding:18px}header a{display:inline-block;margin:5px}h1{font-size:23px}}.remove{background:white;color:#175cd3;border:1px solid #175cd3}.remove:hover{background:#eaf2ff}</style><script src="vlens-pipeline.js"></script></head><body><header><strong>فعلي | V-Lens HR</strong><nav style="margin-top:14px"><a href="dashboard.html">الرئيسية</a><a href="candidates.html">المرشحون</a><a href="shortlist.html" aria-current="page">المرشحون المختارون</a><a href="interviews.html">المقابلات</a></nav></header><main><h1>المرشحون المختارون</h1><p>المرشحون الذين أضفتهم للقائمة المختصرة استعداداً للمراجعة أو المقابلة. هذه الصفحة تعرض اختيارات الديمو المحفوظة على هذا المتصفح.</p><label for="candidateSearch" style="display:block;margin:16px 0 8px;font-weight:700">البحث عن مرشح</label><input id="candidateSearch" type="search" placeholder="اكتب اسم المرشح أو تخصصه" oninput="render()" style="display:block;width:100%;max-width:430px;padding:12px;border:1px solid #b7cdec;border-radius:9px;background:white;color:#102c50;font:inherit;margin-bottom:12px" autocomplete="off"><label for="interviewFilter" style="display:block;margin:16px 0 8px;font-weight:700">تصفية حسب حالة المقابلة</label><select id="interviewFilter" onchange="render()" style="padding:12px;border:1px solid #b7cdec;border-radius:9px;background:white;color:#102c50;font:inherit;min-width:230px;margin-bottom:14px"><option value="all">كل المرشحين</option><option value="none">لم تُجدول مقابلة</option><option value="scheduled">مقابلة مجدولة</option><option value="completed">أُجريت المقابلة</option></select><label for="decisionFilter" style="display:block;margin:10px 0 8px;font-weight:700">تصفية حسب قرار المقابلة</label><select id="decisionFilter" onchange="render()" style="padding:12px;border:1px solid #b7cdec;border-radius:9px;background:white;color:#102c50;font:inherit;min-width:230px;margin-bottom:14px"><option value="all">جميع القرارات</option><option value="next">الانتقال للمرحلة التالية</option><option value="more">مقابلة إضافية</option><option value="wait">قائمة انتظار</option><option value="reject">عدم الاستمرار</option><option value="none">لم يُسجل قرار</option></select><label for="sortCandidates" style="display:block;margin:10px 0 8px;font-weight:700">ترتيب المرشحين</label><select id="sortCandidates" onchange="render()" style="padding:12px;border:1px solid #b7cdec;border-radius:9px;background:white;color:#102c50;font:inherit;min-width:230px;margin-bottom:14px"><option value="priority">الأولوية للمتابعة</option><option value="name">الاسم أبجديًا</option><option value="recent">الأحدث تحديثًا</option></select><div id="recentDecisionNotice" role="status" aria-live="polite" style="display:none;margin:12px 0;padding:12px 14px;border:1px solid #93c5fd;background:#eaf2ff;color:#1048aa;border-radius:10px;font-weight:700"></div><div id="decisionSummary" aria-label="ملخص قرارات المقابلات" style="display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 18px"></div><div id="count" style="font-weight:700;margin-bottom:18px"></div><div class="list" id="list"></div></main><script>const first=['سارة','محمد','نورة','خالد','ريم','عبدالله','ليان','فيصل','هند','عمر','جود','تركي','لمى','سلطان','دانة','زياد','شهد','مازن','رنا','بدر'],last=['العتيبي','القحطاني','الدوسري','الحربي','الشمري','الغامدي','الزهراني','المطيري','المالكي','السهلي'],roles=['محلل بيانات','مهندس برمجيات','أخصائي موارد بشرية','مدير مشاريع','أخصائي أمن سيبراني','مصمم تجربة مستخدم','أخصائي سلاسل إمداد','محاسب'];function candidates(){const arr=Array.from({length:100},(_,i)=>({id:String(i+1),name:first[i%20]+' '+last[(i*7+Math.floor(i/10))%10],role:roles[i%8]}));try{const imported=JSON.parse(localStorage.getItem('vlens_demo_candidates')||'[]');if(Array.isArray(imported))imported.forEach((x,i)=>arr.push({id:String(x.id||'demo-'+(i+1)),name:x.name||'مرشح مستورد',role:x.headline||'مرشح'}))}catch(e){}return arr}function interviewStatus(id){try{const a=JSON.parse(localStorage.getItem('vlens_demo_interviews')||'[]');if(!Array.isArray(a))return 'لم تُجدول مقابلة';const own=a.filter(v=>String(v.candidate_id)===String(id));if(own.some(v=>v.status==='scheduled'))return 'مقابلة مجدولة';if(own.some(v=>v.status==='completed'))return 'أُجريت المقابلة';return 'لم تُجدول مقابلة'}catch(e){return 'لم تُجدول مقابلة'}}function interviewDecision(id){const pipeline=window.VLensPipeline?VLensPipeline.get(id):null;if(pipeline?.interview_decision)return String(pipeline.interview_decision);try{const rec=JSON.parse(localStorage.getItem('vlens_interview_eval_'+id)||'null');if(rec?.decision)return String(rec.decision)}catch(e){}return 'لم يُسجل قرار بعد'}function nextAction(id){const decision=interviewDecision(id),status=interviewStatus(id);if(decision==='عدم الاستمرار')return 'مراجعة قرار عدم الاستمرار';if(decision==='الانتقال للمرحلة التالية')return 'إعداد العرض الوظيفي';if(decision==='مقابلة إضافية')return 'جدولة مقابلة إضافية';if(decision==='قائمة انتظار')return 'متابعة المرشح لاحقًا';if(status==='مقابلة مجدولة')return 'بانتظار إجراء المقابلة';if(status==='أُجريت المقابلة')return 'تسجيل قرار المقابلة';return 'جدولة المقابلة الأولى'}function nextActionUrl(x){const decision=interviewDecision(x.id),status=interviewStatus(x.id),profile='candidate.html?id='+encodeURIComponent(x.id)+'&name='+encodeURIComponent(x.name)+'&role='+encodeURIComponent(x.role);if(decision==='الانتقال للمرحلة التالية')return 'offers.html?candidate='+encodeURIComponent(x.id);if(decision==='مقابلة إضافية'||status==='لم تُجدول مقابلة'&&decision!=='عدم الاستمرار'&&decision!=='قائمة انتظار')return profile+'&schedule=1';if(status==='أُجريت المقابلة'&&!['عدم الاستمرار','قائمة انتظار'].includes(decision))return 'interviews.html?candidate='+encodeURIComponent(x.id);return profile}function selectedDecision(){return document.getElementById('decisionFilter').value}function render(){const all=candidates().filter(x=>window.VLensPipeline&&(VLensPipeline.get(x.id)?.status==='short'||VLensPipeline.get(x.id)?.shortlisted===true));const selected=document.getElementById('interviewFilter').value;const labels={none:'لم تُجدول مقابلة',scheduled:'مقابلة مجدولة',completed:'أُجريت المقابلة'};const query=document.getElementById('candidateSearch').value.trim().toLocaleLowerCase('ar');const byStatus=selected==='all'?all:all.filter(x=>interviewStatus(x.id)===labels[selected]);const decisionSelected=document.getElementById('decisionFilter').value;const decisionLabels={next:'الانتقال للمرحلة التالية',more:'مقابلة إضافية',wait:'قائمة انتظار',reject:'عدم الاستمرار',none:'لم يُسجل قرار بعد'};const byDecision=decisionSelected==='all'?byStatus:byStatus.filter(x=>interviewDecision(x.id)===decisionLabels[decisionSelected]);const items=query?byDecision.filter(x=>(x.name+' '+x.role).toLocaleLowerCase('ar').includes(query)):byDecision;const priority=x=>{const decision=interviewDecision(x.id),status=interviewStatus(x.id);if(decision==='الانتقال للمرحلة التالية')return 0;if(decision==='مقابلة إضافية')return 1;if(status==='لم تُجدول مقابلة')return 2;if(status==='مقابلة مجدولة')return 3;if(decision==='قائمة انتظار')return 4;if(decision==='عدم الاستمرار')return 6;return 5};const sort=document.getElementById('sortCandidates').value;items.sort((a,b)=>sort==='name'?a.name.localeCompare(b.name,'ar'):sort==='recent'?(String(VLensPipeline.get(b.id)?.updated||'').localeCompare(String(VLensPipeline.get(a.id)?.updated||''))):priority(a)-priority(b)||a.name.localeCompare(b.name,'ar'));const decisionGroups=[['الانتقال للمرحلة التالية','next'],['مقابلة إضافية','more'],['قائمة انتظار','wait'],['عدم الاستمرار','reject'],['لم يُسجل قرار بعد','none']];const recent=all.filter(x=>{const rec=VLensPipeline.get(x.id);if(!rec?.interview_decision)return false;const time=Date.parse(rec.interview_decision_at||'');return Number.isFinite(time)&&Date.now()-time>=0&&Date.now()-time<=86400000});const notice=document.getElementById('recentDecisionNotice');notice.style.display=recent.length?'block':'none';notice.replaceChildren();if(recent.length){const heading=document.createElement('strong');heading.textContent='تم تسجيل '+recent.length+' قرار مقابلة خلال آخر 24 ساعة';notice.appendChild(heading);const details=document.createElement('div');details.style.cssText='display:flex;flex-wrap:wrap;gap:8px;margin-top:10px';recent.forEach(x=>{const link=document.createElement('a');link.href='candidate.html?id='+encodeURIComponent(x.id)+'&name='+encodeURIComponent(x.name)+'&role='+encodeURIComponent(x.role);link.textContent=x.name+' — '+interviewDecision(x.id);link.style.cssText='display:inline-block;background:#fff;color:#175cd3;border:1px solid #b7cdec;border-radius:8px;padding:7px 10px;text-decoration:none;font-size:12px';details.appendChild(link)});notice.appendChild(details)}const summary=document.getElementById('decisionSummary');summary.replaceChildren();decisionGroups.forEach(([label,key])=>{const n=all.filter(x=>interviewDecision(x.id)===label).length;const box=document.createElement('button');box.type='button';box.style.cssText='background:#fff;color:#175cd3;border:1px solid #b7cdec;border-radius:10px;padding:12px 14px;font:inherit;cursor:pointer';box.textContent=label+' · '+n;box.title='عرض المرشحين حسب هذا القرار';box.setAttribute('aria-pressed',String(selectedDecision()===key));if(selectedDecision()===key){box.style.background='#175cd3';box.style.color='#fff'}box.addEventListener('click',()=>{document.getElementById('decisionFilter').value=key;render()});summary.appendChild(box)});document.getElementById('count').textContent='المعروض: '+items.length+' من '+all.length+' مرشح مختار';document.getElementById('list').innerHTML=items.length?items.map(x=>'<div class="card"><div><b>'+escapeHtml(x.name)+'</b><small>'+escapeHtml(x.role)+'</small><small>حالة المقابلة: '+escapeHtml(interviewStatus(x.id))+'</small><small>قرار المقابلة: '+escapeHtml(interviewDecision(x.id))+'</small><small style="color:#175cd3;font-weight:700">الإجراء التالي: '+escapeHtml(nextAction(x.id))+'</small><a class="btn" style="display:inline-block;margin-top:8px" href="'+escapeHtml(nextActionUrl(x))+'">تنفيذ الإجراء التالي ←</a></div><a class="btn" href="candidate.html?id='+encodeURIComponent(x.id)+'&name='+encodeURIComponent(x.name)+'&role='+encodeURIComponent(x.role)+'">فتح ملف المرشح</a> <a class="btn" href="candidate.html?id='+encodeURIComponent(x.id)+'&name='+encodeURIComponent(x.name)+'&role='+encodeURIComponent(x.role)+'&schedule=1">جدولة مقابلة</a> <button class="btn remove" type="button" data-remove="'+encodeURIComponent(x.id)+'">إزالة من المختارين</button></div>').join('') :'<div class="empty">لا يوجد مرشحون مطابقون للتصفية الحالية.<p>افتح ملف مرشح واضغط «إضافة للقائمة المختصرة».</p><a class="btn" href="candidates.html">استعراض المرشحين</a></div>'}document.getElementById('list').addEventListener('click',e=>{const btn=e.target.closest('button[data-remove]');if(!btn)return;const id=decodeURIComponent(btn.dataset.remove);const candidate=candidates().find(x=>x.id===id);if(!candidate||!window.VLensPipeline||!(VLensPipeline.get(id)?.status==='short'||VLensPipeline.get(id)?.shortlisted===true))return;if(!confirm('إزالة '+candidate.name+' من المرشحين المختارين؟ سيبقى ملفه ضمن المرشحين ولن يُستبعد.'))return;try{VLensPipeline.set(id,VLensPipeline.get(id)?.status==='short'?'review':VLensPipeline.get(id)?.status,{shortlisted:false});render()}catch(err){alert('تعذر تحديث حالة المرشح. حاول مرة أخرى.')}});function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}render();window.addEventListener('storage',render);window.addEventListener('vlens:pipeline',render)</script></body></html>
