<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المرشحون المختارون | فعلي</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#102c50;font-family:Tahoma,Arial,sans-serif}header{background:#0b2b56;color:white;padding:22px max(20px,calc((100vw - 1000px)/2))}header a{color:white;margin-left:20px;text-decoration:none}main{max-width:1000px;margin:35px auto;padding:0 18px}h1{font-size:27px}p{line-height:1.8;color:#526985}.list{display:grid;gap:14px}.card{background:white;border:1px solid #dce7f6;border-radius:14px;padding:20px;display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.card b{font-size:17px}.card small{display:block;margin-top:9px;color:#526985}.btn{display:inline-block;background:#175cd3;color:#fff;padding:12px 17px;border-radius:9px;text-decoration:none;font-weight:700;border:0;cursor:pointer}.btn:hover{background:#1048aa}.empty{padding:40px;text-align:center;background:white;border-radius:14px;border:1px solid #dce7f6}@media(max-width:600px){header{padding:18px}header a{display:inline-block;margin:5px}h1{font-size:23px}}</style><script src="vlens-pipeline.js"></script></head><body><header><strong>فعلي | V-Lens HR</strong><nav style="margin-top:14px"><a href="dashboard.html">الرئيسية</a><a href="candidates.html">المرشحون</a><a href="shortlist.html" aria-current="page">المرشحون المختارون</a><a href="interviews.html">المقابلات</a></nav></header><main><h1>المرشحون المختارون</h1><p>المرشحون الذين أضفتهم للقائمة المختصرة استعداداً للمراجعة أو المقابلة. هذه الصفحة تعرض اختيارات الديمو المحفوظة على هذا المتصفح.</p><label for="interviewFilter" style="display:block;margin:16px 0 8px;font-weight:700">تصفية حسب حالة المقابلة</label><select id="interviewFilter" onchange="render()" style="padding:12px;border:1px solid #b7cdec;border-radius:9px;background:white;color:#102c50;font:inherit;min-width:230px;margin-bottom:14px"><option value="all">كل المرشحين</option><option value="none">لم تُجدول مقابلة</option><option value="scheduled">مقابلة مجدولة</option><option value="completed">أُجريت المقابلة</option></select><div id="count" style="font-weight:700;margin-bottom:18px"></div><div class="list" id="list"></div></main><script>const first=['سارة','محمد','نورة','خالد','ريم','عبدالله','ليان','فيصل','هند','عمر','جود','تركي','لمى','سلطان','دانة','زياد','شهد','مازن','رنا','بدر'],last=['العتيبي','القحطاني','الدوسري','الحربي','الشمري','الغامدي','الزهراني','المطيري','المالكي','السهلي'],roles=['محلل بيانات','مهندس برمجيات','أخصائي موارد بشرية','مدير مشاريع','أخصائي أمن سيبراني','مصمم تجربة مستخدم','أخصائي سلاسل إمداد','محاسب'];function candidates(){const arr=Array.from({length:100},(_,i)=>({id:String(i+1),name:first[i%20]+' '+last[(i*7+Math.floor(i/10))%10],role:roles[i%8]}));try{const imported=JSON.parse(localStorage.getItem('vlens_demo_candidates')||'[]');if(Array.isArray(imported))imported.forEach((x,i)=>arr.push({id:String(x.id||'demo-'+(i+1)),name:x.name||'مرشح مستورد',role:x.headline||'مرشح'}))}catch(e){}return arr}function interviewStatus(id){try{const a=JSON.parse(localStorage.getItem('vlens_demo_interviews')||'[]');if(!Array.isArray(a))return 'لم تُجدول مقابلة';const own=a.filter(v=>String(v.candidate_id)===String(id));if(own.some(v=>v.status==='scheduled'))return 'مقابلة مجدولة';if(own.some(v=>v.status==='completed'))return 'أُجريت المقابلة';return 'لم تُجدول مقابلة'}catch(e){return 'لم تُجدول مقابلة'}}function render(){const all=candidates().filter(x=>window.VLensPipeline&&VLensPipeline.get(x.id)?.status==='short');const selected=document.getElementById('interviewFilter').value;const labels={none:'لم تُجدول مقابلة',scheduled:'مقابلة مجدولة',completed:'أُجريت المقابلة'};const items=selected==='all'?all:all.filter(x=>interviewStatus(x.id)===labels[selected]);document.getElementById('count').textContent='المعروض: '+items.length+' من '+all.length+' مرشح مختار';document.getElementById('list').innerHTML=items.length?items.map(x=>'<div class="card"><div><b>'+escapeHtml(x.name)+'</b><small>'+escapeHtml(x.role)+'</small><small>حالة المقابلة: '+escapeHtml(interviewStatus(x.id))+'</small></div><a class="btn" href="candidate.html?id='+encodeURIComponent(x.id)+'&name='+encodeURIComponent(x.name)+'&role='+encodeURIComponent(x.role)+'">فتح ملف المرشح</a> <a class="btn" href="candidate.html?id='+encodeURIComponent(x.id)+'&name='+encodeURIComponent(x.name)+'&role='+encodeURIComponent(x.role)+'&schedule=1">جدولة مقابلة</a></div>').join('') :'<div class="empty">لا يوجد مرشحون مطابقون للتصفية الحالية.<p>افتح ملف مرشح واضغط «إضافة للقائمة المختصرة».</p><a class="btn" href="candidates.html">استعراض المرشحين</a></div>'}function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}render();window.addEventListener('storage',render);window.addEventListener('vlens:pipeline',render)</script></body></html>
