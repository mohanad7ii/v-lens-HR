<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تأكيد الحساب | V-Lens</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:linear-gradient(135deg,#07152d,#102c55);color:#172033;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(430px,100%);background:#fff;border-radius:24px;padding:38px;text-align:center;box-shadow:0 30px 90px #0005}.logo{margin:auto;width:58px;height:58px;border-radius:17px;background:linear-gradient(135deg,#7658ff,#2d8fff);color:#fff;display:grid;place-items:center;font-size:25px;font-weight:900}.spin{margin:24px auto;width:32px;height:32px;border:3px solid #e7e9f3;border-top-color:#654cf0;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}h1{font-size:23px}p{color:#758094;font-size:12px;line-height:1.9}.btn{display:none;margin-top:18px;background:#654cf0;color:#fff;text-decoration:none;padding:12px 18px;border-radius:11px;font-size:12px}</style><script src="vlens-api.js"></script></head><body><div class="card"><div class="logo">V</div><div class="spin" id="spin"></div><h1 id="title">جاري تأكيد حسابك…</h1><p id="msg">لحظات ونجهز مساحة V-Lens الخاصة بك.</p><a id="btn" class="btn" href="login.html">العودة لتسجيل الدخول</a></div><script>(async()=>{try{if(VLensAPI.consumeAuthCallback()){try{await VLensAPI.bootstrapProfile()}catch(e){}title.textContent='تم تأكيد حسابك ✓';msg.textContent='تم تفعيل حساب V-Lens بنجاح. جاري تحويلك إلى لوحة التحكم…';setTimeout(()=>location.replace('dashboard.html'),900);return}title.textContent='تم تأكيد البريد';msg.textContent='ارجع إلى تسجيل الدخول واستخدم بريدك وكلمة المرور.'}catch(e){title.textContent='تعذر إكمال التأكيد';msg.textContent='رابط التأكيد غير صالح أو انتهت صلاحيته.'}spin.style.display='none';btn.style.display='inline-block'})()</script></body></html>
