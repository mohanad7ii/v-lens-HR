<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V-Lens HR Demo</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f4f7fb;color:#172033}header{background:#101a33;color:#fff;padding:24px}.wrap{max-width:1100px;margin:auto}h1{margin:0 0 6px}.demo{display:inline-block;margin-top:10px;padding:7px 10px;background:#fff1bd;color:#735400;border-radius:9px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.card,.panel{background:#fff;border-radius:16px;padding:18px;box-shadow:0 4px 18px #18213a12}.num{font-size:28px;font-weight:800}.muted{color:#6b7280}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}input,select{border:1px solid #d9deea;border-radius:10px;padding:12px;font:inherit;background:#fff}input{flex:1;min-width:220px}table{width:100%;border-collapse:collapse}th,td{text-align:right;padding:13px 10px;border-bottom:1px solid #eef1f6}th{color:#687086;font-size:13px}.score{font-weight:800}.pill{display:inline-block;padding:5px 9px;margin:2px;border-radius:99px;background:#eef4ff;color:#2756a6;font-size:12px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.panel{overflow:auto}table{min-width:720px}}</style></head><body><header><div class="wrap"><h1>V-Lens HR</h1><div>منصة ذكية لفرز وتحليل السير الذاتية</div><div class="demo">نسخة ديمو — جميع بيانات المرشحين وهمية</div></div></header><main class="wrap"><section class="stats"><div class="card"><div class="num" id="total">100</div><div class="muted">سيرة ذاتية</div></div><div class="card"><div class="num" id="top"></div><div class="muted">مرشح قوي</div></div><div class="card"><div class="num" id="avg"></div><div class="muted">متوسط المطابقة</div></div><div class="card"><div class="num">6</div><div class="muted">تخصصات</div></div></section><section class="panel"><div class="toolbar"><input id="q" placeholder="ابحث بالاسم أو المهارة أو المسمى"><select id="role"><option value="">كل التخصصات</option></select></div><table><thead><tr><th>#</th><th>المرشح</th><th>المسمى</th><th>الخبرة</th><th>مهارات بارزة</th><th>المطابقة</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>const roles=[['مهندس برمجيات',['JavaScript','React','Node.js']],['محلل بيانات',['Python','SQL','Power BI']],['أخصائي موارد بشرية',['Recruitment','HRIS','Excel']],['مدير مشاريع',['Agile','Scrum','Planning']],['مصمم تجربة مستخدم',['Figma','UX Research','Prototyping']],['أخصائي أمن سيبراني',['SOC','SIEM','Network Security']]];const first=['سارة','محمد','نورة','خالد','ريم','عبدالله','ليان','فيصل','هند','عمر','جود','تركي','لمى','سلطان','دانة','زياد','شهد','مازن','رنا','بدر'];const last=['العتيبي','القحطاني','الدوسري','الحربي','الشمري','الغامدي','الزهراني','المطيري','المالكي','السهلي'];const data=Array.from({length:100},(_,i)=>{const r=roles[i%6];return{id:i+1,name:first[i%20]+' '+last[(i*3)%10],role:r[0],years:1+((i*7)%12),skills:r[1],score:58+((i*17)%41)}});const role=document.getElementById('role');roles.forEach(r=>role.insertAdjacentHTML('beforeend',`<option>${r[0]}</option>`));top.textContent=data.filter(x=>x.score>=85).length;avg.textContent=Math.round(data.reduce((a,b)=>a+b.score,0)/100)+'%';function render(){const q=document.getElementById('q').value.trim().toLowerCase(),rv=role.value;const d=data.filter(x=>(!rv||x.role===rv)&&(!q||[x.name,x.role,...x.skills].join(' ').toLowerCase().includes(q)));rows.innerHTML=d.map(x=>`<tr><td>${x.id}</td><td><b>${x.name}</b></td><td>${x.role}</td><td>${x.years} سنوات</td><td>${x.skills.map(s=>`<span class="pill">${s}</span>`).join('')}</td><td class="score">${x.score}%</td></tr>`).join('');total.textContent=d.length}q.oninput=render;role.onchange=render;render()</script></body></html>
