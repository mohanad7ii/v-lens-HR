<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فريق التوظيف | V-Lens</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f5f7fb;color:#17223b}.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{background:linear-gradient(180deg,#091a36,#0c2447);color:#fff;padding:22px 16px}.brand{font-size:20px;font-weight:900;margin:4px 8px 24px}.brand:before{content:'V';display:inline-grid;place-items:center;width:38px;height:38px;margin-left:9px;border-radius:12px;background:linear-gradient(135deg,#7048f5,#2d8cff)}.nav a{display:block;color:#afbdd1;text-decoration:none;padding:12px 14px;border-radius:11px;margin:4px 0;font-size:11px}.nav a:hover,.nav .active{color:#fff;background:linear-gradient(90deg,#5b46e8,#347ce9)}main{padding:28px;max-width:1400px;width:100%;margin:auto}.head{display:flex;justify-content:space-between;align-items:center}.head h1{margin:0}.muted{font-size:10px;color:#7c899c}.btn{border:0;background:linear-gradient(90deg,#6c4cf0,#4778ee);color:#fff;padding:11px 15px;border-radius:10px;cursor:pointer}.stats,.members{display:grid;gap:12px}.stats{grid-template-columns:repeat(4,1fr);margin:22px 0}.members{grid-template-columns:repeat(3,1fr)}.card{background:#fff;border:1px solid #e5e8ef;border-radius:16px;padding:18px;box-shadow:0 8px 28px #20355b0b}.stat span{font-size:9px;color:#8290a3}.stat b{display:block;font-size:25px;margin-top:6px}.person{display:flex;gap:12px;align-items:center}.av{width:46px;height:46px;border-radius:14px;background:#f0edff;color:#6549df;display:grid;place-items:center;font-weight:900}.person b{font-size:11px}.person small{display:block;color:#8290a3;font-size:8px;margin-top:4px}.role{margin-top:14px;padding-top:12px;border-top:1px solid #eef1f5;display:flex;justify-content:space-between;font-size:9px}.online{color:#17805f}.perm{background:#f7f8fb;border-radius:9px;padding:7px 9px;color:#66758a}@media(max-width:700px){body{padding-bottom:72px}.app{display:block}.side{display:flex;position:fixed;z-index:999;right:0;left:0;bottom:0;top:auto;width:100%;height:64px;padding:6px 8px;overflow-x:auto}.brand{display:none}.nav{display:flex;width:max-content}.nav a{min-width:72px;height:52px;padding:7px;margin:0 2px;text-align:center;font-size:9px}.stats{grid-template-columns:repeat(2,1fr)}.members{grid-template-columns:1fr}main{padding:14px}.head{gap:10px}}@media(max-width:390px){.stats{grid-template-columns:1fr}}</style><style>.vlToast{position:fixed;z-index:1200;left:24px;bottom:24px;background:#111d43;color:#fff;padding:12px 16px;border-radius:11px;box-shadow:0 12px 32px #111d4344;font-size:10px;opacity:0;transform:translateY(12px);pointer-events:none;transition:.25s}.vlToast.show{opacity:1;transform:none}@media(max-width:700px){.vlToast{left:12px;right:12px;bottom:78px;text-align:center}}</style><script src="vlens-api.js"></script></head><body><script>VLensAPI.requireAuth()</script><script>VLensAPI.requireAuth()</script><div class="vlToast" id="vlToast"></div><div class="app"><aside class="side"><div class="brand">V-Lens</div><nav class="nav"><a href="dashboard.html">⌂ الرئيسية</a><a href="candidates.html">◎ المرشحون</a><a href="jobs.html">▣ الوظائف</a><a href="upload-cvs.html">⇧ رفع CV</a><a href="interviews.html">◷ المقابلات</a><a href="offers.html">◇　العروض الوظيفية</a><a href="reports.html">▥ التقارير</a><a class="active" href="team.html">♙ الفريق</a><a href="settings.html">⚙ الإعدادات</a></nav></aside><main><div class="head"><div><h1>فريق التوظيف</h1><div class="muted">إدارة أعضاء الفريق والأدوار والصلاحيات.</div></div><button class="btn" onclick="vlToastMsg('دعوة عضو — ميزة تجريبية')">＋ دعوة عضو</button></div><section class="stats"><div class="card stat"><span>أعضاء الفريق</span><b id="teamTotal">6</b></div><div class="card stat"><span>مديرو التوظيف</span><b id="teamManagers">2</b></div><div class="card stat"><span>المقابلون</span><b id="teamInterviewers">3</b></div><div class="card stat"><span>نشطون الآن</span><b id="teamOnline">4</b></div></section><section class="members" id="members"></section></main></div><script>const d=[['مهند التويجري','مدير التوظيف','كامل الصلاحيات','م'],['سارة القحطاني','أخصائي توظيف','المرشحون والمقابلات','س'],['عبدالعزيز المطيري','مدير إدارة','الوظائف والتقارير','ع'],['نورة الدوسري','مقابل فني','التقييم والمقابلات','ن'],['خالد الحربي','مقابل فني','التقييم والمقابلات','خ'],['ريم الغامدي','منسق توظيف','الجدولة والمرشحون','ر']];function renderDemoTeam(){members.innerHTML=d.map((x,i)=>`<article class="card"><div class="person"><div class="av">${x[3]}</div><div><b>${x[0]}</b><small>${x[1]}</small></div></div><div class="role"><span class="perm">${x[2]}</span><span class="online">${i<4?'● نشط الآن':'○ غير متصل'}</span></div></article>`).join('')}renderDemoTeam();async function loadBackendTeam(){if(!window.VLensAPI||!VLensAPI.isAuthenticated())return;try{const rows=await VLensAPI.request('/rest/v1/profiles?select=id,full_name,role,created_at&order=created_at.asc');if(!rows||!rows.length)return;const roleName={admin:'مدير النظام',recruiter:'أخصائي توظيف',manager:'مدير التوظيف',interviewer:'مقابل'};const perm={admin:'كامل الصلاحيات',recruiter:'المرشحون والوظائف والمقابلات',manager:'الوظائف والتقارير',interviewer:'التقييم والمقابلات'};members.innerHTML=rows.map((x,i)=>'<article class="card"><div class="person"><div class="av">'+(x.full_name||'V').charAt(0)+'</div><div><b>'+(x.full_name||'عضو V-Lens')+'</b><small>'+(roleName[x.role]||x.role||'عضو فريق')+'</small></div></div><div class="role"><span class="perm">'+(perm[x.role]||'صلاحيات محددة')+'</span><span class="online">● حساب فعّال</span></div></article>').join('');teamTotal.textContent=rows.length;teamManagers.textContent=rows.filter(x=>['admin','manager'].includes(x.role)).length;teamInterviewers.textContent=rows.filter(x=>x.role==='interviewer').length;teamOnline.textContent=rows.length}catch(e){console.warn('Backend team unavailable',e)}}loadBackendTeam()</script><script>function vlToastMsg(m){const t=document.getElementById('vlToast');t.textContent=m;t.classList.add('show');clearTimeout(window._vlt);window._vlt=setTimeout(()=>t.classList.remove('show'),2400)}</script><style>.langSwitch{position:fixed;z-index:2100;left:16px;top:16px;border:1px solid #e1e5ed;background:#fff;color:#17223b;border-radius:10px;padding:8px 11px;font:700 10px Tahoma,Arial;cursor:pointer;box-shadow:0 8px 22px #17223b18}@media(max-width:700px){.langSwitch{top:8px;left:8px}}</style><button class="langSwitch" id="vlensLangToggle">EN</button><script>
(function(){const b=document.getElementById('vlensLangToggle');const pairs=[['الرئيسية','Home'],['المرشحون','Candidates'],['الوظائف','Jobs'],['رفع CV','Upload CV'],['المقابلات','Interviews'],['التقارير','Reports'],['الفريق','Team'],['الإعدادات','Settings'],['فريق التوظيف','Recruitment Team'],['إدارة أعضاء الفريق والأدوار والصلاحيات.','Manage team members, roles and permissions.'],['دعوة عضو','Invite Member'],['أعضاء الفريق','Team Members'],['مديرو التوظيف','Recruitment Managers'],['المقابلون','Interviewers'],['نشطون الآن','Online Now'],['مدير التوظيف','Recruitment Manager'],['أخصائي توظيف','Recruiter'],['مدير إدارة','Department Manager'],['مقابل فني','Technical Interviewer'],['منسق توظيف','Recruitment Coordinator'],['كامل الصلاحيات','Full Access'],['المرشحون والمقابلات','Candidates & Interviews'],['الوظائف والتقارير','Jobs & Reports'],['التقييم والمقابلات','Evaluations & Interviews'],['الجدولة والمرشحون','Scheduling & Candidates'],['نشط الآن','Online'],['غير متصل','Offline']];
function apply(l){localStorage.setItem('vlens_lang',l);if(l==='ar'){if(document.documentElement.lang==='en')location.reload();return}document.documentElement.lang='en';document.documentElement.dir='ltr';const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){if(n.parentElement&&!['SCRIPT','STYLE'].includes(n.parentElement.tagName)){let x=n.nodeValue;pairs.forEach(p=>x=x.split(p[0]).join(p[1]));n.nodeValue=x}}b.textContent='عربي'}b.onclick=()=>apply((localStorage.getItem('vlens_lang')||'ar')==='ar'?'en':'ar');if((localStorage.getItem('vlens_lang')||'ar')==='en')apply('en')})();
</script><script>
(function(){if(window.__vlFullLang)return;window.__vlFullLang=1;const M={'الرئيسية':'Home','المرشحون':'Candidates','الوظائف':'Jobs','رفع وتحليل CV':'Upload & Analyze CV','المقابلات':'Interviews','العروض الوظيفية':'Job Offers','التقارير والتحليلات':'Reports & Analytics','التقارير':'Reports','فريق التوظيف':'Recruitment Team','الإعدادات':'Settings','مدير التوظيف':'Recruitment Manager','لوحة التحكم':'Dashboard','إجمالي المرشحين':'Total Candidates','الوظائف النشطة':'Active Jobs','المقابلات القادمة':'Upcoming Interviews','متوسط المطابقة':'Average Match','بحث ذكي':'Smart Search','وظيفة جديدة':'New Job','قاعدة المواهب':'Talent Pool','المسمى الوظيفي':'Job Title','سنوات الخبرة':'Years of Experience','المهارات':'Skills','الموقع':'Location','القسم':'Department','حفظ':'Save','إلغاء':'Cancel','تعديل':'Edit','حذف':'Delete','بحث':'Search','عرض الكل':'View All','قيد المراجعة':'Under Review','قائمة مختصرة':'Shortlisted','تم التوظيف':'Hired','مستبعد':'Rejected','ملاحظات':'Notes','التقييم':'Evaluation','الخبرة':'Experience','التعليم':'Education','الشهادات':'Certifications','اللغات':'Languages','المصدر':'Source','الحالة':'Status','العودة':'Back','مراجعة مطلوبة':'Review Required','جاهز':'Ready'};let O=new Map();function T(s){let x=s;Object.entries(M).sort((a,b)=>b[0].length-a[0].length).forEach(([a,e])=>x=x.split(a).join(e));return x}function A(){let en=(localStorage.getItem('vlens_lang')||'ar')==='en';document.documentElement.lang=en?'en':'ar';document.documentElement.dir=en?'ltr':'rtl';let w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT),n;while(n=w.nextNode()){if(!n.parentElement||['SCRIPT','STYLE'].includes(n.parentElement.tagName))continue;if(!O.has(n))O.set(n,n.nodeValue);n.nodeValue=en?T(O.get(n)):O.get(n)}document.querySelectorAll('input[placeholder],textarea[placeholder]').forEach(e=>{e.dataset.vo=e.dataset.vo||e.placeholder;e.placeholder=en?T(e.dataset.vo):e.dataset.vo})}setTimeout(A,20);setTimeout(A,700);new MutationObserver(()=>{clearTimeout(window.__vlt);window.__vlt=setTimeout(A,60)}).observe(document.body,{childList:true,subtree:true})})();
</script></body></html>
