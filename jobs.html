<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الوظائف | V-Lens</title><script>if(sessionStorage.getItem('vlens_demo')!=='1')location.replace('login.html')</script><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f5f7fb;color:#17223b}.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{background:linear-gradient(180deg,#091a36,#0c2447);color:#fff;padding:22px 16px}.brand{font-size:20px;font-weight:900;margin:4px 8px 24px}.brand:before{content:'V';display:inline-grid;place-items:center;width:38px;height:38px;margin-left:9px;border-radius:12px;background:linear-gradient(135deg,#7048f5,#2d8cff)}.nav a{display:block;color:#afbdd1;text-decoration:none;padding:12px 14px;border-radius:11px;margin:4px 0;font-size:11px}.nav a:hover,.nav .active{color:#fff;background:linear-gradient(90deg,#5b46e8,#347ce9)}main{padding:28px;max-width:1400px;width:100%;margin:auto}.head{display:flex;justify-content:space-between;align-items:center}.head h1{margin:0}.btn{background:linear-gradient(90deg,#6c4cf0,#4778ee);color:#fff;border:0;padding:11px 16px;border-radius:10px}.stats,.jobs{display:grid;gap:13px}.stats{grid-template-columns:repeat(4,1fr);margin:22px 0}.card{background:#fff;border:1px solid #e5e8ef;border-radius:16px;padding:18px;box-shadow:0 8px 28px #20355b0b}.stat b{display:block;font-size:27px;margin-top:7px}.stat span,.muted{color:#7c899c;font-size:10px}.jobs{grid-template-columns:repeat(2,1fr)}.jobtop{display:flex;justify-content:space-between}.badge{background:#eaf9f3;color:#16805e;padding:6px 9px;border-radius:20px;font-size:9px}.job h3{margin:0 0 7px}.meta{color:#8290a3;font-size:10px}.bar{height:7px;background:#edf0f5;border-radius:9px;margin:15px 0;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#6c4cf0,#3e80ef)}.foot{display:flex;justify-content:space-between;font-size:10px}.foot a{color:#6 </style><style>.vlToast{position:fixed;z-index:1200;left:24px;bottom:24px;background:#111d43;color:#fff;padding:12px 16px;border-radius:11px;box-shadow:0 12px 32px #111d4344;font-size:10px;opacity:0;transform:translateY(12px);pointer-events:none;transition:.25s}.vlToast.show{opacity:1;transform:none}@media(max-width:700px){.vlToast{left:12px;right:12px;bottom:78px;text-align:center}}</style></head><body><div class="vlToast" id="vlToast"></div><div class="app"><aside class="side"><div class="brand">V-Lens</div><nav class="nav"><a href="dashboard.html">⌂　الرئيسية</a><a href="candidates.html">◎　المرشحون · 100</a><a class="active" href="jobs.html">▣　الوظائف · 12</a><a href="upload-cvs.html">⇧　رفع وتحليل CV</a><a href="interviews.html">◷　المقابلات</a><a href="reports.html">▥　التقارير</a><a href="team.html">♙　فريق التوظيف</a><a href="settings.html">⚙　الإعدادات</a></nav></aside><main><div class="head"><div><h1>الوظائف</h1><div class="muted">إدارة الفرص ومتابعة تدفق المرشحين لكل وظيفة.</div></div><button class="btn" onclick="vlToastMsg('تم فتح نموذج وظيفة تجريبية')">＋ إضافة وظيفة</button></div><section class="stats"><div class="card stat"><span>الوظائف النشطة</span><b>12</b></div><div class="card stat"><span>إجمالي المتقدمين</span><b>100</b></div><div class="card stat"><span>مقابلات</span><b>15</b></div><div class="card stat"><span>متوسط المطابقة</span><b>82%</b></div></section><section class="jobs" id="jobs"></section></main></div><script>const d=[['مهندس برمجيات أول','الرياض',24,92],['محلل بيانات','الرياض',18,78],['أخصائي أمن سيبراني','جدة',16,66],['مدير مشاريع','الخبر',14,58],['أخصائي موارد بشرية','الرياض',9,48],['محاسب أول','القصيم',8,42],['مصمم تجربة مستخدم','الرياض',6,34],['أخصائي سلاسل إمداد','الدمام',5,29],['مهندس نظم','جدة',4,24],['مسؤول توظيف','الرياض',3,18],['محلل أعمال','الخبر',2,14],['منسق مشاريع','القصيم',1,9]];jobs.innerHTML=d.map((x,i)=>`<article class="card job"><div class="jobtop"><div><h3>${x[0]}</h3><div class="meta">${x[1]} · JOB-${String(i+1).padStart(
