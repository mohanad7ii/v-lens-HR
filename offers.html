<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>العروض الوظيفية | V-Lens</title><script>if(sessionStorage.getItem('vlens_demo')!=='1')location.replace('login.html')</script><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f5f7fb;color:#17223b}.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{background:#0a1c39;color:#fff;padding:22px 16px}.brand{font-size:20px;font-weight:900;margin:8px 10px 24px}.nav a{display:block;color:#afbdd1;text-decoration:none;padding:12px 14px;border-radius:11px;margin:4px 0;font-size:11px}.nav a:hover,.nav .active{background:linear-gradient(90deg,#5b46e8,#347ce9);color:#fff}main{padding:28px;max-width:1200px;width:100%;margin:auto}.head{display:flex;justify-content:space-between;align-items:end}.muted{color:#7d899b;font-size:9px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.card{background:#fff;border:1px solid #e4e8ef;border-radius:16px;padding:17px;box-shadow:0 8px 28px #20355b0b}.stat b{display:block;font-size:25px;margin-top:7px}.stat span{font-size:9px;color:#7d899b}.offer{display:grid;grid-template-columns:1.3fr .8fr .8fr 1fr auto;align-items:center;gap:12px;margin-bottom:10px}.offer b{font-size:10px}.offer small{display:block;font-size:8px;color:#8490a2;margin-top:4px}.status{padding:6px 9px;border-radius:20px;background:#fff4dc;color:#9b6b09;font-size:8px}.actions{display:flex;gap:5px}.actions button{border:0;border-radius:8px;padding:8px 9px;font-size:8px;cursor:pointer}.accept{background:#e4f8f0;color:#147657}.reject{background:#feecec;color:#ad3030}.empty{text-align:center;padding:45px;color:#8290a3}.lang{position:fixed;left:15px;top:15px;border:1px solid #dfe4ec;background:#fff;border-radius:9px;padding:8px 10px;z-index:1000}@media(max-width:700px){body{padding-bottom:70px}.app{display:block}.side{display:flex;position:fixed;bottom:0;left:0;right:0;height:64px;padding:6px;z-index:900;overflow:auto}.brand{display:none}.nav{display:flex;width:max-content}.nav a{min-width:72px;text-align:center;padding:9px 7px}.stats{grid-template-columns:1fr 1fr}main{padding:14px}.offer{grid-template-columns:1fr auto}.offer>div:nth-child(2),.offer>div:nth-child(3){display:none}.actions{grid-column:1/-1}.actions button{flex:1}}</style></head><body><button class="lang" id="lang">EN</button><div class="app"><aside class="side"><div class="brand">V-Lens</div><nav class="nav"><a href="dashboard.html">⌂ الرئيسية</a><a href="candidates.html">◎ المرشحون</a><a href="jobs.html">▣ الوظائف</a><a href="interviews.html">◷ المقابلات</a><a class="active" href="offers.html">◈ العروض</a><a href="reports.html">▥ التقارير</a><a href="team.html">♙ الفريق</a></nav></aside><main><div class="head"><div><h1>العروض الوظيفية</h1><div class="muted">إدارة عروض المرشحين وإغلاق دورة التوظيف.</div></div></div><section class="stats"><div class="card stat"><span>إجمالي العروض</span><b id="total">0</b></div><div class="card stat"><span>بانتظار الرد</span><b id="pending">0</b></div><div class="card stat"><span>مقبولة</span><b id="accepted">0</b></div><div class="card stat"><span>مرفوضة</span><b id="rejected">0</b></div></section><div id="list"></div></main></div><script>function getOffers(){const a=[];for(let i=1;i<=100;i++){try{const o=JSON.parse(localStorage.getItem('vlens_offer_'+i)||'null');if(o)a.push(o)}catch(e){}}return a}function render(){const a=getOffers();total.textContent=a.length;pending.textContent=a.filter(x=>x.status==='sent').length;accepted.textContent=a.filter(x=>x.status==='accepted').length;rejected.textContent=a.filter(x=>x.status==='rejected').length;if(!a.length){list.innerHTML='<div class="card empty">لا توجد عروض بعد. أنشئ عرضاً من ملف المرشح.</div>';return}list.innerHTML=a.map(o=>'<div class="card offer"><div><b>'+o.candidate+'</b><small>'+o.role+'</small></div><div><b>'+Number(o.salary).toLocaleString('ar-SA')+' ر.س</b><small>الراتب الشهري</small></div><div><b>'+o.start+'</b><small>تاريخ المباشرة</small></div><div><span class="status">'+({sent:'بانتظار الرد',accepted:'مقبول',rejected:'مرفوض'}[o.status])+'</span></div><div class="actions">'+(o.status==='sent'?'<button class="accept" onclick="decide(\''+o.id+'\',\'accepted\')">✓ قبول</button><button class="reject" onclick="decide(\''+o.id+'\',\'rejected\')">رفض</button>':'')+'</div></div>').join('')}function decide(id,s){const k='vlens_offer_'+id,o=JSON.parse(localStorage.getItem(k));o.status=s;o.updated=new Date().toISOString();localStorage.setItem(k,JSON.stringify(o));if(s==='accepted')localStorage.setItem('vlens_candidate_status_'+id,JSON.stringify({status:'hired',updated:new Date().toLocaleString('ar-SA'),source:'offer'}));if(s==='rejected')localStorage.setItem('vlens_candidate_status_'+id,JSON.stringify({status:'rejected',updated:new Date().toLocaleString('ar-SA'),source:'offer'}));render()}render();const pairs=[['الرئيسية','Home'],['المرشحون','Candidates'],['الوظائف','Jobs'],['المقابلات','Interviews'],['العروض الوظيفية','Job Offers'],['العروض','Offers'],['التقارير','Reports'],['الفريق','Team'],['إجمالي العروض','Total Offers'],['بانتظار الرد','Awaiting Response'],['مقبولة','Accepted'],['مرفوضة','Rejected'],['مقبول','Accepted'],['مرفوض','Rejected'],['قبول','Accept'],['رفض','Reject']];function apply(l){localStorage.setItem('vlens_lang',l);if(l==='ar'){if(document.documentElement.lang==='en')location.reload();return}document.documentElement.lang='en';document.documentElement.dir='ltr';const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){if(n.parentElement&&!['SCRIPT','STYLE'].includes(n.parentElement.tagName)){let s=n.nodeValue;pairs.forEach(p=>s=s.split(p[0]).join(p[1]));n.nodeValue=s}}lang.textContent='عربي'}lang.onclick=()=>apply((localStorage.getItem('vlens_lang')||'ar')==='ar'?'en':'ar');if((localStorage.getItem('vlens_lang')||'ar')==='en')apply('en');</script></body></html>
