<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>العروض الوظيفية | V-Lens</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f5f7fb;color:#17223b}.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{background:#0a1c39;color:#fff;padding:22px 16px}.brand{font-size:20px;font-weight:900;margin:8px 10px 24px}.nav a{display:block;color:#afbdd1;text-decoration:none;padding:12px 14px;border-radius:11px;margin:4px 0;font-size:11px}.nav a:hover,.nav .active{background:linear-gradient(90deg,#5b46e8,#347ce9);color:#fff}main{padding:28px;max-width:1200px;width:100%;margin:auto}.head{display:flex;justify-content:space-between;align-items:end}.muted{color:#7d899b;font-size:9px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.card{background:#fff;border:1px solid #e4e8ef;border-radius:16px;padding:17px;box-shadow:0 8px 28px #20355b0b}.stat b{display:block;font-size:25px;margin-top:7px}.stat span{font-size:9px;color:#7d899b}.offer{display:grid;grid-template-columns:1.3fr .8fr .8fr 1fr auto;align-items:center;gap:12px;margin-bottom:10px}.offer b{font-size:10px}.offer small{display:block;font-size:8px;color:#8490a2;margin-top:4px}.status{padding:6px 9px;border-radius:20px;background:#fff4dc;color:#9b6b09;font-size:8px}.actions{display:flex;gap:5px}.actions button{border:0;border-radius:8px;padding:8px 9px;font-size:8px;cursor:pointer}.accept{background:#e4f8f0;color:#147657}.reject{background:#feecec;color:#ad3030}.empty{text-align:center;padding:45px;color:#8290a3}.lang{position:fixed;left:15px;top:15px;border:1px solid #dfe4ec;background:#fff;border-radius:9px;padding:8px 10px;z-index:1000}@media(max-width:700px){body{padding-bottom:70px}.app{display:block}.side{display:flex;position:fixed;bottom:0;left:0;right:0;height:64px;padding:6px;z-index:900;overflow:auto}.brand{display:none}.nav{display:flex;width:max-content}.nav a{min-width:72px;text-align:center;padding:9px 7px}.stats{grid-template-columns:1fr 1fr}main{padding:14px}.offer{grid-template-columns:1fr auto}.offer>div:nth-child(2),.offer>div:nth-child(3){display:none}.actions{grid-column:1/-1}.actions button{flex:1}}</style><script src="vlens-api.js"></script><style>

</style><style>@media(min-width:701px){.top{height:68px!important;min-height:68px!important;padding:0 28px!important;background:#fff!important;border-bottom:1px solid #e7ebf1!important;box-shadow:0 1px 0 #12244208!important}.top>b:first-child{font-size:12px!important;font-weight:800!important;color:#17223b!important}.user{min-width:150px!important;padding-inline-start:14px!important;border-inline-start:1px solid #e7ebf1!important;line-height:1.45!important}.user b{font-size:11px!important;font-weight:800!important;color:#1c2941!important}.user span{font-size:9px!important;color:#8793a5!important}.content{padding-top:24px!important}.head{align-items:center!important;margin-bottom:20px!important}.head h1{font-size:25px!important;font-weight:800!important;color:#17223b!important}.btn{font-weight:700!important}}@media(min-width:701px) and (max-width:1180px){.top{padding:0 20px!important}.head h1{font-size:23px!important}}</style><style>.card,.panel,.offer{border:1px solid #e6eaf0!important;border-radius:12px!important;box-shadow:0 3px 14px #17223b0a!important}.row.header,thead{background:#f7f9fc!important;color:#69768a!important}.row{border-bottom-color:#edf0f4!important}.pill,.vlStatus{font-weight:700!important}</style></head><body><script>VLensAPI.requireAuth()</script><script>VLensAPI.requireAuth()</script><button class="lang" id="lang">EN</button><div class="app"><aside class="side"><div class="brand">V-Lens</div><nav class="nav"><a href="dashboard.html">⌂ الرئيسية</a><a href="candidates.html">◎ المرشحون</a><a href="jobs.html">▣ الوظائف</a><a href="upload-cvs.html">⇧ رفع وتحليل CV</a><a href="interviews.html">◷ المقابلات</a><a class="active" href="offers.html">◈ العروض</a><a href="reports.html">▥ التقارير</a><a href="team.html">♙ الفريق</a><a href="settings.html">⚙ الإعدادات</a></nav></aside><main><div class="head"><div><h1>العروض الوظيفية</h1><div class="muted">إدارة عروض المرشحين وإغلاق دورة التوظيف.</div></div></div><section class="stats"><div class="card stat"><span>إجمالي العروض</span><b id="total">0</b></div><div class="card stat"><span>بانتظار الرد</span><b id="pending">0</b></div><div class="card stat"><span>مقبولة</span><b id="accepted">0</b></div><div class="card stat"><span>مرفوضة</span><b id="rejected">0</b></div></section><div id="list"></div></main></div><script>let backendOffers=[];function getOffers(){const a=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k||!k.startsWith('vlens_offer_'))continue;try{const o=JSON.parse(localStorage.getItem(k)||'null');if(o)a.push(o)}catch(e){}}return backendOffers.length?backendOffers:a}function render(){const a=getOffers();total.textContent=a.length;pending.textContent=a.filter(x=>x.status==='sent').length;accepted.textContent=a.filter(x=>x.status==='accepted').length;rejected.textContent=a.filter(x=>x.status==='rejected').length;if(!a.length){list.innerHTML='<div class="card empty">لا توجد عروض بعد. أنشئ عرضاً من ملف المرشح.</div>';return}list.innerHTML=a.map(o=>'<div class="card offer"><div><b>'+o.candidate+'</b><small>'+o.role+'</small></div><div><b>'+Number(o.salary).toLocaleString('ar-SA')+' ر.س</b><small>الراتب الشهري</small></div><div><b>'+o.start+'</b><small>تاريخ المباشرة</small></div><div><span class="status">'+({sent:'بانتظار الرد',accepted:'مقبول',rejected:'مرفوض'}[o.status])+'</span></div><div class="actions">'+(o.status==='sent'?'<button class="accept" onclick="decide(\''+o.id+'\',\'accepted\')">✓ قبول</button><button class="reject" onclick="decide(\''+o.id+'\',\'rejected\')">رفض</button>':'')+'</div></div>').join('')}async function decide(id,s){if(String(id).includes('-')&&window.VLensAPI&&VLensAPI.isAuthenticated()){try{const rows=await VLensAPI.request('/rest/v1/offers?id=eq.'+encodeURIComponent(id)+'&select=application_id&limit=1');await VLensAPI.request('/rest/v1/offers?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:s,responded_at:new Date().toISOString()})});if(rows&&rows[0])await VLensAPI.request('/rest/v1/applications?id=eq.'+encodeURIComponent(rows[0].application_id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({stage:s==='accepted'?'accepted':'rejected'})});await loadBackendOffers();return}catch(e){console.warn('Backend offer decision failed',e)}}const k='vlens_offer_'+id,o=JSON.parse(localStorage.getItem(k));o.status=s;o.updated=new Date().toISOString();localStorage.setItem(k,JSON.stringify(o));const next=s==='accepted'?'hired':'rejected';if(window.VLensPipeline)VLensPipeline.set(id,next,{source:'offer',job:o.job});else{localStorage.setItem('vlens_candidate_status_'+id,JSON.stringify({status:next,updated:new Date().toLocaleString('ar-SA'),source:'offer'}));const job=o.job||localStorage.getItem('vlens_candidate_job_'+id);if(job){const pk='vlens_job_pipeline_'+encodeURIComponent(job);let p={};try{p=JSON.parse(localStorage.getItem(pk)||'{}')}catch(e){}p[id]=next;localStorage.setItem(pk,JSON.stringify(p))}}render()}async function loadBackendOffers(){if(!window.VLensAPI||!VLensAPI.isAuthenticated()){render();return}try{const rows=await VLensAPI.listOffers()||[];if(rows.length){const enriched=[];for(const o of rows){let candidate='مرشح V-Lens';try{const apps=await VLensAPI.request('/rest/v1/applications?id=eq.'+encodeURIComponent(o.application_id)+'&select=candidate_id&limit=1');if(apps&&apps[0]){const cs=await VLensAPI.request('/rest/v1/candidates?id=eq.'+encodeURIComponent(apps[0].candidate_id)+'&select=full_name&limit=1');if(cs&&cs[0])candidate=cs[0].full_name}}catch(e){}enriched.push({id:o.id,candidate,role:o.job_title||'عرض وظيفي',job:o.job_title||'',salary:o.salary||0,start:o.start_date||'—',status:o.status==='sent'?'sent':o.status==='accepted'?'accepted':o.status==='rejected'?'rejected':o.status})}backendOffers=enriched;}render()}catch(e){console.warn('Backend offers unavailable',e);render()}}loadBackendOffers();window.addEventListener('storage',render);window.addEventListener('vlens:pipeline',render);</script><script src="vlens-role-ui.js"></script><script src="vlens-i18n.js"></script></body></html>
