<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>استعادة كلمة المرور | فعلي</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07152d;font-family:Tahoma,Arial;color:#172033;padding:16px;box-sizing:border-box}.card{background:white;width:min(440px,100%);box-sizing:border-box;border-radius:18px;padding:32px}h1{font-size:24px}p{line-height:1.9;color:#566176}input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:10px;font:inherit;margin-top:12px}input{border:1px solid #ccd3df}button{border:0;background:#654cf0;color:white;cursor:pointer}a{display:block;margin-top:20px;color:#654cf0}#status{min-height:24px}</style><script src="vlens-api.js?v=20261011b"></script></head><body><main class="card"><h1>استعادة كلمة المرور</h1><p>اكتب بريدك الإلكتروني وسنرسل لك رابط تعيين كلمة مرور جديدة.</p><form id="form"><input id="email" type="email" required autocomplete="email" placeholder="البريد الإلكتروني"><button id="send" type="submit">إرسال رابط الاستعادة</button></form><p id="status" role="status" aria-live="polite"></p><a href="login.html">العودة لتسجيل الدخول</a></main><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('send'),s=document.getElementById('status');b.disabled=true;s.textContent='جاري إرسال الطلب…';try{await VLensAPI.resetPassword(document.getElementById('email').value.trim());s.textContent='إذا كان البريد مسجلاً، سيصلك رابط الاستعادة. افحص البريد غير المرغوب فيه أيضًا.'}catch(err){s.textContent='تعذر إرسال الرابط: '+(err.status?'رمز '+err.status+' — ':'')+(err.message||'خطأ اتصال')}finally{b.disabled=false}})</script></body></html>
