<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الدخول التجريبي | V-Lens</title></head><body style="font-family:Tahoma,Arial;text-align:center;padding:45px"><h2>جاري فتح التجربة…</h2><p>إذا لم تنتقل تلقائيًا، اضغط الزر أدناه.</p><button onclick="enter()" style="padding:15px 25px;background:#1765ff;color:white;border:0;border-radius:12px;font-size:18px">دخول التجربة</button><script>function enter(){try{sessionStorage.setItem("vlens_demo","1");sessionStorage.setItem("vlens_offline_demo","1");if(localStorage.getItem("vlens_demo_seed_mode")!=="empty"){const saved={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith("vlens_")&&!["vlens_demo_seed_mode","vlens_demo_backup"].includes(k)&&!["vlens_access_token","vlens_refresh_token","vlens_lang"].includes(k))saved[k]=localStorage.getItem(k)}localStorage.setItem("vlens_demo_backup",JSON.stringify(saved));Object.keys(saved).forEach(k=>localStorage.removeItem(k));localStorage.setItem("vlens_demo_seed_mode","empty")}}catch(e){}location.replace("dashboard.html")}enter()</script></body></html>
